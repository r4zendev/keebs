tap = "QMARK"
shifted = "EXCL"

[behaviors.v_dot_qmark]
recipe = "shift_morph"
tap = "FSLH"
shifted = "AMPS"

[behaviors.thumb_magic]
recipe = "repeat_magic"
timing = "magic"
hold = "LSHIFT"
fallback = "sticky_shift"
shifted = "caps_word"
repeat_timeout_ms = 800

[behaviors.mouse_ht]
recipe = "tap_hold"
timing = "mouse"
hold = { layer = "Mouse", mode = "momentary" }
tap = { layer = "Mouse", mode = "toggle" }

[behaviors.sym_alpha2]
recipe = "tap_hold"
timing = "thumb"
hold = { layer = "Symbol", mode = "momentary" }
tap = { layer = "VestnikX", mode = "sticky" }

[behaviors.glove_magic]
recipe = "tap_hold"
timing = "magic"
targets = ["zmk"]
hold = { layer = "Magic", mode = "momentary" }
tap = { platform = "rgb_status" }

[behaviors.smart_mouse]
recipe = "smart_mouse"
layer = "Mouse"
ignored_layers = ["Mouse", "Nav"]
ignored_positions = ["R_INNER_TOP", "R_INDEX_TOP", "R_MIDDLE_TOP", "R_RING_TOP", "R_PINKY_TOP", "L_PINKY_HOME", "L_RING_HOME", "L_MIDDLE_HOME", "L_INDEX_HOME", "L_THUMB_B", "R_THUMB_A", "R_THUMB_B"]

[behaviors.leader]
recipe = "leader"

[behaviors.lang_en]
recipe = "macro"
steps = [
  { layer = "Graphite", mode = "move" },
  { key = "N1", mods = ["LCTRL", "LSHIFT", "LGUI"] },
]

[behaviors.lang_ru]
recipe = "macro"
steps = [
  { layer = "VestnikDm", mode = "move" },
  { key = "N2", mods = ["LCTRL", "LSHIFT", "LGUI"] },
]

[behaviors.to_graphite]
