[behaviors.sqt_dqt]
recipe = "shift_morph"
tap = "SQT"
shifted = "DQT"

[behaviors.minus_slash]
recipe = "shift_morph"
tap = "MINUS"
shifted = "FSLH"

[behaviors.dot_qmark]
recipe = "shift_morph"
tap = "DOT"
shifted = "QMARK"

[behaviors.comma_excl]
recipe = "shift_morph"
tap = "COMMA"
shifted = "EXCL"

[behaviors.lpar_lt]
recipe = "shift_morph"
tap = "LPAR"
shifted = "LT"

[behaviors.rpar_gt]
recipe = "shift_morph"
tap = "RPAR"
shifted = "GT"

[behaviors.lbkt_lbrc]
recipe = "shift_morph"
tap = "LBKT"
shifted = "LBRC"

[behaviors.rbkt_rbrc]
recipe = "shift_morph"
tap = "RBKT"
shifted = "RBRC"

[behaviors.undo_redo]
recipe = "shift_morph"
tap = { key = "Z", mods = ["LCTRL"] }
shifted = { key = "Z", mods = ["LCTRL", "LSHIFT"] }

[behaviors.paste_morph]
recipe = "shift_morph"
tap = { os = "paste" }
shifted = { key = "V", mods = ["LCTRL"] }

[behaviors.copy_cut]
recipe = "shift_morph"
tap = { key = "C", mods = ["LCTRL"] }
shifted = { key = "X", mods = ["LCTRL"] }

[behaviors.bspc_del]
recipe = "shift_morph"
