[timings.home_row]
tapping_term_ms = 180
quick_tap_ms = 175
prior_idle_ms = 100
flavor = "balanced"
opposite_hand_hold = true

[timings.thumb]
tapping_term_ms = 175
quick_tap_ms = 175
flavor = "balanced"

[timings.thumb_tap_preferred]
tapping_term_ms = 175
quick_tap_ms = 175
flavor = "tap-preferred"

[timings.magic]
tapping_term_ms = 200
quick_tap_ms = 175
flavor = "balanced"

[timings.mouse]
tapping_term_ms = 200
flavor = "balanced"

[timings.function_number]
tapping_term_ms = 250
flavor = "tap-preferred"

[timings.combo]
term_ms = 30
prior_idle_ms = 50

[timings.leader]
timeout_ms = 250

[timings.sticky_mod]
