[adaptives.graphite]
enabled = true
timeout_ms = 1000
strict_modifiers = true
swaps_enabled = false
swaps = [
  ["S", "C", "D"],
  ["P", "H", "N"],
  ["C", "S", "X"],
  ["U", "E", "O"],
  ["W", "S", "G"],
  ["S", "W", "V"],
  ["R", "L", "W"],
]
rules = [
  { input = "S", after = ["Y", "O", "U"], emit = ["SQT"] },
  { input = "O", after = ["I", "U"], emit = ["BSPC", "O", "U"] },
]

[adaptives.dusk]
enabled = false
timeout_ms = 1000
strict_modifiers = true
swaps_enabled = false
swaps = [
  ["U", "O", "E"],
  ["SQT", "O", "L"],
  ["SQT", "U", "M"],
]
rules = []

