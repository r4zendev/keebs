# Probe firmware only: reduce the host-facing BLE/GATT surface.
#
# Use with EXTRA_CONF_PATH for one test board. Do not merge into production
# until it proves whether host-facing optional GATT services are involved.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

