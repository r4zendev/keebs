# Probe firmware: conservative BLE HID surface for unstable hosts/links.
#
# This keeps the low-latency connection interval from ble_plain_baseline, but
# explicitly prevents the LE 2M PHY path that baseline re-enabled by disabling
# ZMK_BLE_EXPERIMENTAL_CONN.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# Remove optional host-facing services while testing stale BlueZ GATT state.
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_BT_GATT_CACHING=n

# Keep the BLE controller negotiation surface small and force LE 1M.
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_CTLR_PHY_2M=n

# Prefer frequent link events over battery life for latency and supervision.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
