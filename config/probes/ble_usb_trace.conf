# Probe firmware only: emit ZMK/Zephyr logs over USB CDC ACM.
#
# Use on the central half while reproducing a BLE drop. This is intended to
# answer whether firmware sees the disconnect callback, what connection
# parameters were negotiated, and whether advertising restarts afterward.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
