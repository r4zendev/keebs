# Probe firmware only: make BLE link supervision less brittle.
#
# The captured KLOTZ failure was an HCI Connection Timeout (0x08), not an
# auth/bonding failure. This profile lowers peripheral latency and raises the
# supervision timeout so short RF/controller stalls have more room to recover.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1200

# Split half link, for boards where the central talks to a BLE peripheral half.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=4
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1200
