# nRF52 BLE stability + low-latency profile.
# Auto-included by build.sh for any nRF52 board.

# Internal LFRC avoids disconnects caused by marginal/faulty 32 kHz crystals on
# nRF52840 modules. Costs a tiny bit of power vs a healthy external LFXO.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Max TX power (+8 dBm).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Host-facing BLE: locked 7.5 ms interval, no event skipping, 4 s supervision.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Re-request the preferred interval ~100 ms after (re)connection instead of GAP's
# default 5 s — kills the 5 s slow-interval window that lags pointing after a brief
# BLE drop/reconnect.
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=100

# Split link: match host link timing.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# 1M PHY only — 3 dB more link budget than 2M, negligible latency gain for HID packets.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_DATA_LEN_UPDATE=n

# More ACL/EVT/RX buffers to absorb bursts (mouse layer, combos).
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_CTLR_RX_BUFFERS=10

# Disable LE Ping — supervision timeout is enough; saves controller overhead.
CONFIG_BT_CTLR_LE_PING=n

# Larger system workqueue stack for keymap/input throughput.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
