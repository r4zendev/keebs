name: Build ANSIC

on: [push, pull_request, workflow_dispatch]

jobs:
  left:
    uses: ./.github/workflows/base.build.yml
    with:
      keyboard: ansic
      board: nice_nano/nrf52840/zmk
      shield: ansic_left
  right:
    uses: ./.github/workflows/base.build.yml
    with:
      keyboard: ansic
      board: nice_nano/nrf52840/zmk
      shield: ansic_right
  merge:
    needs: [left, right]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: ansic
          pattern: artifact-*
          delete-merged: true
