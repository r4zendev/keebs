name: Build ZMK Firmware

on:
  workflow_call:
    inputs:
      keyboard:
        required: true
        type: string
      board:
        required: true
        type: string
      shield:
        required: false
        type: string
      snippets:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    env:
      board_safe: placeholder
    steps:
      - name: Sanitize board name
        run: echo "board_safe=$(echo '${{ inputs.board }}' | tr '/' '_')" >> $GITHUB_ENV
      - name: Set artifact name
        run: |
          if [ -n "${{ inputs.shield }}" ]; then
            shield_safe="$(echo '${{ inputs.shield }}' | awk '{print $1}')"
            echo "artifact=${shield_safe}-${board_safe}" >> $GITHUB_ENV
          else
            echo "artifact=${board_safe}" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
      - name: Generate shared config
        run: ./scripts/generate zmk
      - name: Prepare config
        run: |
          kb_dir="config/keyboards/${{ inputs.keyboard }}"

          # Symlink keyboard-specific files into config/
          for f in "$kb_dir"/*; do
            [ -e "$f" ] && [ "$(basename "$f")" != "shields" ] && [ "$(basename "$f")" != "${{ inputs.keyboard }}.conf" ] && ln -sf "$(realpath "$f")" config/
          done

          # Custom shield definitions
          if [ -d "$kb_dir/shields" ]; then
            mkdir -p config/boards
            ln -sf "$(realpath "$kb_dir/shields")" config/boards/shields
          fi

          # Merge shared and keyboard-specific Kconfig like build.sh.
          if [ -f "$kb_dir/${{ inputs.keyboard }}.conf" ]; then
            { [ -f config/default.conf ] && cat config/default.conf; cat "$kb_dir/${{ inputs.keyboard }}.conf"; } > "config/${{ inputs.keyboard }}.conf"
          elif [ -f config/default.conf ]; then
            ln -sf "$(realpath config/default.conf)" "config/${{ inputs.keyboard }}.conf"
          fi

          # Resolve west manifest
          if [ -f "$kb_dir/${{ inputs.keyboard }}.west.yml" ]; then
            echo "manifest=${{ inputs.keyboard }}.west.yml" >> $GITHUB_ENV
          else
            echo "manifest=default.west.yml" >> $GITHUB_ENV
          fi
      - uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: west-${{ env.manifest }}-${{ hashFiles(format('config/{0}', env.manifest)) }}
      - run: west init -l config --mf ${{ env.manifest }}
      - run: west update
      - name: Install Python extras
        if: inputs.snippets != ''
        run: |
          python3 - <<'PY' || python3 -m pip install -q protobuf grpcio-tools
          import google.protobuf
          import grpc_tools.protoc
          PY
      - name: Apply patches
        run: |
          kb_dir="config/keyboards/${{ inputs.keyboard }}"
          if [ -d "$kb_dir/shields" ]; then
            for patch in "$kb_dir"/shields/*/*.patch; do
              [ -f "$patch" ] || continue
              cd zephyr && git apply "$OLDPWD/$patch" 2>/dev/null && echo "Applied $patch" || echo "Already applied: $patch"
              cd "$OLDPWD"
            done
          fi
      - run: west zephyr-export
      - name: Build
        run: |
          snippet_args=""
          for snippet in ${{ inputs.snippets }}; do
            snippet_args="$snippet_args -S $snippet"
          done
          shield_arg=""
          if [ -n "${{ inputs.shield }}" ]; then
            shield_arg="-DSHIELD=${{ inputs.shield }}"
          fi
          west build -s zmk/app -b ${{ inputs.board }} $snippet_args -- \
            ${shield_arg:+"$shield_arg"} \
            -DZMK_CONFIG=$PWD/config
      - run: mkdir -p artifacts && cp build/zephyr/zmk.uf2 artifacts/${{ env.artifact }}.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact }}
          path: artifacts/
