name: Build ZMK Firmware

on:
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string
      board:
        required: true
        type: string
      shield:
        required: false
        type: string
      patch_dir:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    env:
      board_safe: placeholder
    steps:
      - name: Sanitize board name
        run: echo "board_safe=$(echo '${{ inputs.board }}' | tr '/' '_')" >> $GITHUB_ENV
      - name: Set artifact name
        run: |
          if [ -n "${{ inputs.shield }}" ]; then
            echo "artifact=${{ inputs.shield }}-${board_safe}" >> $GITHUB_ENV
          else
            echo "artifact=${board_safe}" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: west-${{ inputs.manifest }}-${{ hashFiles(format('config/{0}', inputs.manifest)) }}
      - run: west init -l config --mf ${{ inputs.manifest }}
      - run: west update
      - name: Apply patches
        if: inputs.patch_dir
        run: |
          for patch in config/${{ inputs.patch_dir }}/*.patch; do
            [ -f "$patch" ] || continue
            cd zephyr && git apply "$OLDPWD/$patch" 2>/dev/null && echo "Applied $patch" || echo "Already applied: $patch"
            cd "$OLDPWD"
          done
      - run: west zephyr-export
      - run: >
          west build -s zmk/app -b ${{ inputs.board }} --
          ${{ inputs.shield && format('-DSHIELD={0}', inputs.shield) || '' }}
          -DZMK_CONFIG=$PWD/config
      - run: mkdir -p artifacts && cp build/zephyr/zmk.uf2 artifacts/${{ env.artifact }}.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact }}
          path: artifacts/
